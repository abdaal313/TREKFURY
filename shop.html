<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>TREKfury - Shop Elite Gear</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="shop-page-body">
<nav class="navbar">
  <div class="logo">TREK<span>fury</span></div>
  <div class="nav-links">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="signup.html" class="nav-btn">Sign-up</a>

</nav>

  <main class="shop-container">

      <div class="product-card">

      </div>

      <div class="product-card">

        <p class="price">$85.00</p>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREKfury - Join the Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="signup-page-body">
<nav class="navbar">
  <div class="logo">TREK<span>fury</span></div>
  <div class="nav-links">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="shop.html" class="nav-btn">Shop</a>
    <a href="login.html" class="nav-btn">Login</a>
    <a href="cart.html" class="nav-btn">Cart</a>
  </div>
</nav>
  <main class="signup-container">
    <div class="signup-glass-box">  
      <div class="signup-header">
        <h2>Create your <span>Account</span></h2>
        <p>Join elite adventurers and unlock trail-ready benefits.</p>
      </div>
      <form class="signup-form">     
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="25" min="12" required>
        </div>
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="input-group password-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required> 
          <div class="ai-password-box">
            <span class="ai-sparkle">✨ AI Suggestion:</span>
            <span class="suggested-pass" id="ai-pass">Trek#77_PeakFury</span>
            <button type="button" class="use-pass-btn" onclick="usePassword()">Use It</button>
          </div>
        </div>
        <div class="input-group">
          <label for="promo">Promo Code <span class="optional-tag">(Optional)</span></label>
          <input type="text" id="promo" placeholder="e.g., WELCOME15" style="text-transform: uppercase;">
        </div>
        <div class="captcha-container">
          <div class="captcha-box">
            <input type="checkbox" id="captcha" required>
            <label for="captcha">I am an adventurer, not a robot</label>
          </div>
          <div class="captcha-badge">🛡️ Secured by TREKshield</div>
        </div>
        <button type="submit" class="signup-submit-btn">Create Account</button>
      </form>
      <p class="switch-form-text">Already have an account? <a href="#login">Log In</a></p>
    </div>
  </main>
  <script>
    function usePassword() {
      const suggested = document.getElementById('ai-pass').innerText;
      document.getElementById('password').value = suggested;
      document.getElementById('password').type = 'text'; // Briefly show it to them
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREKfury - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page-body">

 <nav class="navbar">
  <div class="logo">TREK<span>fury</span></div>

  <div class="nav-links">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="shop.html" class="nav-btn">Shop</a>
    <a href="login.html" class="nav-btn">Login</a>
    <a href="cart.html" class="nav-btn">Cart</a>
  </div>
</nav>

  <main class="contact-container">
    <div class="contact-glass-box">
      
      <div class="contact-header">
        <p class="contact-subtitle">Get In Touch</p>
        <h2>Contact <span>TREKfury</span></h2>
        <p>Have questions about your gear or need support on the trail? Our team is standing by.</p>
      </div>

      <div class="contact-split-layout">
        
        <div class="contact-info-side">
          <div class="info-card">
            <span class="info-icon">✉️</span>
            <div>
              <h4>Email Us</h4>
              <p>elarachainspvtltd@gmail.com</p>
            </div>
          </div>
          
          <div class="info-card">
            <span class="info-icon">📞</span>
            <div>
              <h4>Call Basecamp</h4>
              <p>+91 8899002903</p>
            </div>
          </div>

          <div class="info-card">
            <span class="info-icon">🗺️</span>
            <div>
              <h4>HQ Address</h4>
              <p>325, Pampore, Kashmir, 192121</p>
            </div>
          </div>
        </div>

        <form class="contact-form-side" onsubmit="return false;">
          <div class="contact-input-group">
            <label for="contact-name">Full Name</label>
            <input type="text" id="contact-name" placeholder="Your Name" required>
          </div>
          
          <div class="contact-input-group">
            <label for="contact-email">Email Address</label>
            <input type="email" id="contact-email" placeholder="you@example.com" required>
          </div>

          <div class="contact-input-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" placeholder="What support do you need for your expedition?" rows="5" required></textarea>
          </div>

          <button type="submit" class="contact-submit-btn">Send Message</button>
        </form>

      </div>

    </div>
  </main>

</body>
</html>

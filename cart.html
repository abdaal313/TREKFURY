<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREKfury - Your Gear Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="cart-page-body">
<nav class="navbar">
  <div class="logo">TREK<span>fury</span></div>
  <div class="nav-links">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="shop.html" class="nav-btn">Shop</a>
    <a href="signup.html" class="nav-btn">Sign-up</a>
    <a href="login.html" class="nav-btn">Login</a>
  </div>
</nav>

  <main class="cart-container">
    <div class="cart-glass-box">
      <h2>Your <span>Adventure Gear</span></h2>
      
      <div class="cart-content">
        <div class="cart-items">
          
          <div class="cart-item">
            <div class="product-img-placeholder"></div>
            <div class="item-info">
              <h4>Alpine Pro Backpack</h4>
              <p>Size: 45L | Midnight Black</p>
            </div>
            <div class="item-price">$129.00</div>
          </div>

          <div class="cart-item">
            <div class="product-img-placeholder"></div>
            <div class="item-info">
              <h4>Trail-Blazer Boots</h4>
              <p>Size: 10 US | Granite Gray</p>
            </div>
            <div class="item-price">$185.00</div>
          </div>

        </div>

        <div class="order-summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$314.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span class="free-shipping">FREE</span>
          </div>
          <hr class="summary-divider">
          <div class="summary-row total">
            <span>Total</span>
            <span>$314.00</span>
          </div>
          <button type="button" class="checkout-btn">Proceed to Checkout</button>
        </div>

      </div>
    </div>
  </main>

</body>
</html>

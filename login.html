<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREKfury - Welcome Back</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
<nav class="navbar">
  <div class="logo">TREK<span>fury</span></div>
  <div class="nav-links">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="shop.html" class="nav-btn">Shop</a>
    <a href="signup.html" class="nav-btn">Sign-up</a>
    <a href="cart.html" class="nav-btn">Cart</a>
  </div>
</nav>

  <main class="login-container">
    <div class="login-glass-box">
      
      <div class="login-header">
        <h2>Welcome <span>Back</span></h2>
        <p>Gear up and log into your adventurer dashboard.</p>
      </div>

      <form class="login-form">
        
        <div class="input-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>

        <div class="input-group">
          <div class="password-label-row">
            <label for="login-password">Password</label>
            <a href="#forgot" class="forgot-pass-link">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <div class="remember-me-container">
          <input type="checkbox" id="remember-me">
          <label for="remember-me">Keep me logged in on this trail</label>
        </div>

        <button type="submit" class="login-submit-btn">Secure Login</button>

      </form>

      <p class="switch-form-text">New to the expedition? <a href="signup.html">Create an Account</a></p>

    </div>
  </main>

</body>
</html>
